version: "3.8"

# Secrets are never stored here.
# Run with:  ./start.sh
# Reset:     ./start.sh --reset

services:
  db:
    image: postgres:15-alpine
    container_name: finance_db
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: finance_backend
    # Port not exposed externally — all traffic flows through Caddy.
    expose:
      - "8080"
    environment:
      DB_URL:         ${DB_URL}
      JWT_SECRET:     ${JWT_SECRET}
      ALLOWED_ORIGIN: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: finance_frontend
    # Port not exposed externally — all traffic flows through Caddy.
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: finance_caddy
    ports:
      - "80:80"    # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"  # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC)
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # TLS certificates (persisted across restarts)
      - caddy_config:/config      # Caddy config cache
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:    # Persists Let's Encrypt certs — never wipe this in production
  caddy_config:
